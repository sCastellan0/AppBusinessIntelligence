<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0.8"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Resplandor de fondo -->
  <circle cx="228" cy="200" r="130" fill="url(#glowGradient)"/>

  <!-- Globo principal con tonos más oscuros -->
  <circle cx="228" cy="200" r="90" fill="none" stroke="#1E40AF" stroke-width="2.5" opacity="0.7"/>

  <!-- Líneas de latitud -->
  <ellipse cx="228" cy="200" rx="90" ry="27" fill="none" stroke="#1E40AF" stroke-width="2" opacity="0.6"/>
  <ellipse cx="228" cy="200" rx="90" ry="54" fill="none" stroke="#1E40AF" stroke-width="2" opacity="0.6"/>

  <!-- Líneas de longitud -->
  <ellipse cx="228" cy="200" rx="27" ry="90" fill="none" stroke="#1E40AF" stroke-width="2" opacity="0.6"/>
  <ellipse cx="228" cy="200" rx="54" ry="90" fill="none" stroke="#1E40AF" stroke-width="2" opacity="0.6"/>

  <!-- Nodos de datos con tonos oscuros -->
  <circle cx="175" cy="155" r="5" fill="#2563EB" opacity="0.9"/>
  <circle cx="281" cy="165" r="5" fill="#2563EB" opacity="0.9"/>
  <circle cx="195" cy="220" r="5" fill="#2563EB" opacity="0.9"/>
  <circle cx="261" cy="225" r="5" fill="#2563EB" opacity="0.9"/>

  <!-- Líneas de conexión -->
  <line x1="175" y1="155" x2="228" y2="200" stroke="#1E40AF" stroke-width="2" opacity="0.7"/>
  <line x1="281" y1="165" x2="228" y2="200" stroke="#1E40AF" stroke-width="2" opacity="0.7"/>
  <line x1="195" y1="220" x2="228" y2="200" stroke="#1E40AF" stroke-width="2" opacity="0.7"/>
  <line x1="261" y1="225" x2="228" y2="200" stroke="#1E40AF" stroke-width="2" opacity="0.7"/>

  <!-- Flecha de crecimiento con tonos más oscuros -->
  <g transform="translate(145, 220)">
    <!-- Base de la flecha (sombra) -->
    <path d="M 15 50 L 45 25 L 60 30 L 80 10 L 100 15 L 120 0 L 145 5" 
          fill="none" 
          stroke="#0F172A" 
          stroke-width="14" 
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.5"/>

    <!-- Cuerpo principal de la flecha -->
    <path d="M 15 50 L 45 25 L 60 30 L 80 10 L 100 15 L 120 0 L 145 5" 
          fill="none" 
          stroke="url(#arrowGradient)" 
          stroke-width="10" 
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Punta de flecha -->
    <path d="M 145 5 L 130 12 L 138 20 Z" 
          fill="#2563EB"
          stroke="#1E40AF"
          stroke-width="2"/>

    <!-- Puntos brillantes en la flecha -->
    <circle cx="60" cy="30" r="3" fill="#3B82F6" opacity="0.8"/>
    <circle cx="100" cy="15" r="3" fill="#3B82F6" opacity="0.8"/>
  </g>

  <!-- Texto ANALYSTIX con mejor contraste -->
  <text x="228" y="360" 
        font-family="Arial, sans-serif" 
        font-size="44" 
        font-weight="600"
        letter-spacing="6"
        fill="#3B82F6" 
        text-anchor="middle">
    ANALYSTIX
  </text>

  <!-- Sombra del texto -->
  <text x="228" y="362" 
        font-family="Arial, sans-serif" 
        font-size="44" 
        font-weight="600"
        letter-spacing="6"
        fill="#0F172A" 
        text-anchor="middle"
        opacity="0.5">
    ANALYSTIX
  </text>
</svg>
