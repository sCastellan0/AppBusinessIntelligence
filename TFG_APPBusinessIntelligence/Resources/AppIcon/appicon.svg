<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo azul oscuro -->
    <rect x="0" y="0" width="456" height="456" fill="#1E3A8A" />

    <defs>
        <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1"/>
        </linearGradient>
    </defs>

    <!-- Globo -->
    <circle cx="228" cy="200" r="85" fill="none" stroke="#3A6B82" stroke-width="3" opacity="0.8"/>
    <ellipse cx="228" cy="200" rx="85" ry="25" fill="none" stroke="#3A6B82" stroke-width="2" opacity="0.7"/>
    <ellipse cx="228" cy="200" rx="85" ry="50" fill="none" stroke="#3A6B82" stroke-width="2" opacity="0.7"/>
    <ellipse cx="228" cy="200" rx="25" ry="85" fill="none" stroke="#3A6B82" stroke-width="2" opacity="0.7"/>
    <ellipse cx="228" cy="200" rx="50" ry="85" fill="none" stroke="#3A6B82" stroke-width="2" opacity="0.7"/>

    <!-- Nodos -->
    <circle cx="175" cy="160" r="6" fill="#00D9FF"/>
    <circle cx="280" cy="165" r="6" fill="#00D9FF"/>
    <circle cx="190" cy="230" r="6" fill="#00D9FF"/>
    <circle cx="265" cy="235" r="6" fill="#00D9FF"/>

    <!-- Conexiones -->
    <line x1="175" y1="160" x2="280" y2="165" stroke="#00B8E6" stroke-width="2.5" opacity="0.7"/>
    <line x1="280" y1="165" x2="265" y2="235" stroke="#00B8E6" stroke-width="2.5" opacity="0.7"/>
    <line x1="265" y1="235" x2="190" y2="230" stroke="#00B8E6" stroke-width="2.5" opacity="0.7"/>
    <line x1="190" y1="230" x2="175" y2="160" stroke="#00B8E6" stroke-width="2.5" opacity="0.7"/>

    <!-- Flecha de crecimiento -->
    <path d="M 130 250 L 165 225 L 185 235 L 220 205 L 250 185 L 280 175 L 305 165" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="12" 
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Punta de flecha -->
    <path d="M 305 165 L 290 175 L 298 185 Z" 
          fill="#00D9FF"/>

    <!-- Puntos brillantes -->
    <circle cx="185" cy="235" r="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="250" cy="185" r="4" fill="#FFFFFF" opacity="0.9"/>
